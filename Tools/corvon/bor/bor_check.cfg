# Production gate: read the option bytes out of flash and cross-check the
# loaded copy. No power cycle, no meter.
#
# openocd -f interface/stlink-dap.cfg -f corvon-f405-swd.cfg -c "set SILICON geehy" \
#         -f bor_common.cfg -f bor_check.cfg
#
# The option bytes live at 0x1FFFC000 as a 16-bit value followed by its bitwise
# complement. A self-consistent pair proves the cell holds a complete write,
# which is the thing the power cycle in bor_verify.cfg exists to establish -
# and it reads the storage rather than the register, so it answers the question
# more directly than the shadow read ever did.
#
# NOT YET CALIBRATED. Nobody has confirmed that a read of 0x1FFFC000 cannot
# also be served from the loaded copy. Until one board has gone through a
# measured power cycle with a before/after read of both this address and
# OPTCR, keep running bor_verify.cfg alongside this.

init
halt

set ob  [r32 0x1FFFC000]
set val [expr {$ob & 0xFFFF}]
set cpl [expr {($ob >> 16) & 0xFFFF}]
echo [format "option bytes @0x1FFFC000 = 0x%08X   value 0x%04X   complement 0x%04X" $ob $val $cpl]

if { $cpl != [expr {(~$val) & 0xFFFF}] } {
    echo [format "complement 0x%04X != ~0x%04X - stored word is not a complete write" $cpl $val]
    shutdown error
}
if { (($val >> 8) & 0xFF) != 0xAA } {
    echo [format "RDP 0x%02X != 0xAA - QUARANTINE" [expr {($val >> 8) & 0xFF}]]
    shutdown error
}
if { (($val >> 2) & 0x3) != 0 } {
    echo [format "BOR_LEV %d - not level 3" [expr {($val >> 2) & 0x3}]]
    shutdown error
}
if { [ob_check $EXPECTED_LOCKED] } { echo "loaded copy disagrees with storage"; shutdown error }

echo "BOR CHECK PASS - level 3 in flash, complement valid, loaded copy agrees"
shutdown
