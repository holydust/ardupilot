# Production gate: read the option bytes out of flash and cross-check the
# loaded copy. No power cycle, no meter.
#
# openocd -f interface/stlink-dap.cfg -f corvon-f405-swd.cfg -c "set SILICON geehy" \
#         -f bor_common.cfg -f bor_check.cfg
#
# The option bytes live at 0x1FFFC000 as a 16-bit value followed by its bitwise
# complement, and the write-protection word lives the same way at 0x1FFFC008.
# A self-consistent pair proves the cell holds a complete write.
#
# NOT A REPLACEMENT FOR bor_verify.cfg. An adversarial review on 2026-08-25
# left one model standing in which 0x1FFFC000 is served by the option byte
# controller's own read buffer - updated when OPTSTRT is accepted, reloaded
# from NVM at reset - which would let a board whose NVM commit silently failed
# pass both this gate and Gate 1. Nothing measured so far separates that from a
# direct read of the cell, and this check has only ever been run on good parts,
# so its ability to reject a bad one is unmeasured. Keep running bor_verify.cfg
# alongside it. See README.md.

init
halt
# both gates can be run on their own, so do not read controller state that may
# still be settling from whatever ran before
wait_not_busy 5000

# every exit path leaves the board running: a stopped unit downstream looks
# exactly like a dead one, which cost us most of a morning on 2026-08-25
proc bail {msg} {
    echo $msg
    catch {resume}
    shutdown error
}

set ob  [r32 0x1FFFC000]
set val [expr {$ob & 0xFFFF}]
set cpl [expr {($ob >> 16) & 0xFFFF}]
echo [format "option bytes @0x1FFFC000 = 0x%08X   value 0x%04X   complement 0x%04X" $ob $val $cpl]

if { $cpl != [expr {(~$val) & 0xFFFF}] } {
    bail [format "complement 0x%04X != ~0x%04X - stored word is not a complete write" $cpl $val]
}
if { (($val >> 8) & 0xFF) != 0xAA } {
    bail [format "RDP 0x%02X != 0xAA - QUARANTINE" [expr {($val >> 8) & 0xFF}]]
}
if { (($val >> 2) & 0x3) != 0 } {
    bail [format "BOR_LEV %d - not level 3" [expr {($val >> 2) & 0x3}]]
}

# The write-protection word is a separate cell programmed by the same option
# byte operation. Without reading it a torn write that got 0x1FFFC000 right and
# corrupted NWPROT passes Gate 1 and passes the checks above, because OPTCR
# still holds what the register write put there - only a reload from flash
# exposes it. Reading the storage side closes that particular hole here.
if { $SILICON eq "gd" } {
    echo "NWPROT storage check skipped - the GD option block is laid out"
    echo "differently (FMC_OBCTL0/1) and this address has not been calibrated"
} else {
    set wp   [r32 0x1FFFC008]
    set wval [expr {$wp & 0xFFFF}]
    set wcpl [expr {($wp >> 16) & 0xFFFF}]
    echo [format "NWPROT     @0x1FFFC008 = 0x%08X   value 0x%04X   complement 0x%04X" $wp $wval $wcpl]
    if { $wcpl != [expr {(~$wval) & 0xFFFF}] } {
        bail [format "NWPROT complement 0x%04X != ~0x%04X - torn option block write" $wcpl $wval]
    }
    if { ($wval & 0xFFF) != 0xFFF } {
        bail [format "NWPROT 0x%03X != 0xFFF - sectors are write protected" [expr {$wval & 0xFFF}]]
    }
}

# NOTE: this compares OPTCR against the fixed policy constant, NOT against the
# value just read out of storage. In the production flow OPTCR still holds what
# bor_program wrote into the register, so a pass here is not independent
# evidence about the flash. Do not read it as "loaded copy agrees with storage".
if { [ob_check $EXPECTED_LOCKED] } { bail "OPTCR does not match policy" }

echo "BOR CHECK PASS - level 3 and NWPROT intact in flash, OPTCR matches policy"
echo "NOT a release on its own: bor_verify.cfg still has to run. See README.md."
catch {resume}
shutdown
