# Gate 1: write the BOR level 3 option byte and verify immediately.
#
# openocd -f interface/<probe>.cfg -f corvon-f405-swd.cfg -c "set SILICON st" \
#         -f bor_common.cfg -f bor_program.cfg
#
# A pass here is NOT a pass for the unit: the read-back is the register
# shadow. Only bor_verify.cfg, after a controlled power cycle, proves the
# flash cell took it.

init
halt
set fsize [expr {[r32 0x1FFF7A20] >> 16}]
echo [format "DBG_ID 0x%08X FLASH %d KB" [r32 0xE0042000] $fsize]
if { $fsize != 0x0400 } { echo "flash size gate FAIL"; shutdown error }
# enable once the spike has filled in the measured value:
# if { [r32 0xE0042000] != $EXPECTED_DBGID } { shutdown error }
wait_not_busy 2000
write_memory 0x40023C0C 32 [expr {[r32 0x40023C0C] & $ERRMASK}]
if { ([r32 0x40023C0C] & $ERRMASK) != 0 } { echo "stale flags stuck - QUARANTINE"; shutdown error }
set old [r32 0x40023C14]
echo [format "OPTCR before: 0x%08X" $old]
if { (($old >> 8) & 0xFF) != 0xAA } { echo "RDP/SPC != 0xAA - QUARANTINE"; shutdown error }
if { [ob_check $EXPECTED_LOCKED] == 0 } {
    echo "already programmed - gate1 idempotent PASS (gate2 still required)"; shutdown }
write_memory 0x40023C08 32 0x08192A3B
write_memory 0x40023C08 32 0x4C5D6E7F
if { ([r32 0x40023C14] & 0x1) != 0 } { echo "option unlock failed"; shutdown error }
set newval [expr {$old & ~0xF}]
write_memory 0x40023C14 32 $newval
write_memory 0x40023C14 32 [expr {$newval | 0x2}]
wait_not_busy 5000
set fail 0
if { ([r32 0x40023C0C] & $ERRMASK) != 0 } {
    echo [format "error flags 0x%08X - FAIL" [r32 0x40023C0C]]; set fail 1 }
if { $fail == 0 && [ob_check [expr {$EXPECTED_LOCKED & ~1}]] } { set fail 1 }
write_memory 0x40023C14 32 [expr {[r32 0x40023C14] | 0x1}]   ;# best-effort relock, all paths
if { ([r32 0x40023C14] & 0x1) != 1 } { echo "relock failed"; set fail 1 }
if { $fail } { echo "GATE1 FAIL"; shutdown error }
echo [format "OPTCR after: 0x%08X - GATE1 OK, controlled power-cycle then gate2" [r32 0x40023C14]]
shutdown
