# Shared register map, masks and expected values for the BOR option byte.
# Injected by the fixture: -c "set SILICON st|geehy|gd"
#
# Identity is controlled by the BOM / reel / work order / silkscreen vision,
# NOT by software: ST and Geehy both report DBG_ID 0x413 and all three
# sources have 1MB flash, so software cannot tell the vendors apart.

if { ![info exists SILICON] } { echo "SILICON not set"; shutdown error }
switch $SILICON {
    st    { set EXPECTED_LOCKED 0x0FFFAAE1; set ERRMASK 0xF2 }
    geehy { set EXPECTED_LOCKED 0x0FFFAAE1; set ERRMASK 0xF2 }
    gd    { set EXPECTED_LOCKED 0x2FFFAAE1; set ERRMASK 0x1D2
            set EXPECTED_OBCTL1 0x0FFF0000 }   ;# uncertified emergency stock only
    default { echo "bad SILICON"; shutdown error }
}

proc r32 {addr} { return [lindex [read_memory $addr 32 1] 0] }

proc wait_not_busy {timeout_ms} {
    for {set i 0} {$i < [expr {$timeout_ms / 10}]} {incr i} {
        if { ([r32 0x40023C0C] & 0x10000) == 0 } { return }
        sleep 10
    }
    echo "QUARANTINE_HOLD_POWER: BUSY timeout - keep VDD & probe, no relay, manual disposition"
    shutdown error
}

proc ob_check {expected} {
    global SILICON EXPECTED_OBCTL1
    set val [r32 0x40023C14]
    if { $val != $expected } {
        echo [format "OPTCR 0x%08X != expected 0x%08X" $val $expected]; return 1 }
    if { $SILICON eq "gd" && [r32 0x40023C18] != $EXPECTED_OBCTL1 } {
        echo [format "OBCTL1 0x%08X != policy" [r32 0x40023C18]]; return 1 }
    return 0
}
