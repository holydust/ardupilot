# Gate 2: re-read the option byte after a controlled power cycle.
# THIS is the pass criterion for the unit.
#
# openocd -f interface/<probe>.cfg -f corvon-f405-swd.cfg -c "set SILICON st" \
#         -f bor_common.cfg -f bor_verify.cfg
#
# Run it only after VDD has been measured below 0.3V and held there for at
# least 500ms. The board's bulk caps will otherwise hold VDD above the reset
# threshold, the option byte never reloads, and this reads back the same
# shadow value Gate 1 saw - which proves nothing.

init
halt
# this gate is run on its own, after a power cycle - do not read controller
# state that may still be settling
wait_not_busy 5000
if { [ob_check $EXPECTED_LOCKED] } {
    echo "GATE2 VERIFY FAIL"
    catch {resume}
    shutdown error
}
echo "GATE2 PASS - BOR Level 3 active"
# leave the unit running: a stopped board downstream looks like a dead one
catch {resume}
shutdown
