# CORVON F405-class boards (DW608 / DW609) - minimal SWD target.
#
# Deliberately NOT target/stm32f4x.cfg: that registers the ST flash driver
# and pokes ST-proprietary DBGMCU addresses. The silicon here is an APM32 or
# GD32 clone, so keep the target generic and touch nothing vendor-specific.
# This file carries no board-level content and serves both boards.

transport select swd
source [find target/swj-dp.tcl]
swj_newdap corvon cpu
dap create corvon.dap -chain-position corvon.cpu
target create corvon.cpu cortex_m -dap corvon.dap

# The SWD pads (silkscreen "G V C D") may not break out NRST - unconfirmed.
# Once confirmed present, switch to srst_only.
reset_config none
