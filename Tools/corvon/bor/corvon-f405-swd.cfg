# CORVON F405-class boards (DW608 / DW609) - minimal SWD target.
#
# Deliberately NOT target/stm32f4x.cfg: that registers the ST flash driver
# and pokes ST-proprietary DBGMCU addresses. The silicon here is an APM32 or
# GD32 clone, so keep the target generic and touch nothing vendor-specific.
# This file carries no board-level content and serves both boards.
#
# Pair it with interface/stlink-dap.cfg, not interface/stlink.cfg: the latter
# selects the hla driver, which owns the DAP itself and rejects "dap create".
#
# Not usable on a blank part. With empty flash the core double-faults on its
# first fetch and sits in lockup; the dapdirect path reports that as fatal and
# init dies with "unable to connect to the target". First flash of a bare board
# goes through Tools/corvon/flash/flash-swd.sh, which uses hla. By the time the
# BOR fixture sees a board it is already running firmware.

# OpenOCD <= 0.12 names the ST-Link DAP transport "dapdirect_swd"; 0.13 and
# CMSIS-DAP probes take plain "swd".
if { [catch {transport select dapdirect_swd}] } { transport select swd }

source [find target/swj-dp.tcl]
# irlen and friends are ignored under SWD but swj_newdap still demands them.
# No -expected-id on purpose: the clones do not carry ST's DP IDCODE.
swj_newdap corvon cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create corvon.dap -chain-position corvon.cpu
target create corvon.cpu cortex_m -dap corvon.dap

# The SWD pads (silkscreen "G V C D") may not break out NRST - unconfirmed.
# Once confirmed present, switch to srst_only.
reset_config none
