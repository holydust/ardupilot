# Is the 4.7K pull-up on the compass side actually reachable from the MCU?
#
# Reading PB6/PB7 as "high" proves nothing on its own: an open analog switch
# leaves them floating and the switch's ESD diode to V+ can leak them high.
# The real test is to sink them low and release: only a genuine pull-up
# snaps them back. Repeat with the mux commanded both ways.
set GPIOA 0x40020000
set GPIOB 0x40020400

proc r32 {a} { return [lindex [read_memory $a 32 1] 0] }
proc bpins {} { global GPIOB; set v [r32 [expr {$GPIOB + 0x10}]]
                return [format "SCL=%d SDA=%d" [expr {($v>>6)&1}] [expr {($v>>7)&1}]] }

halt

set sv_amoder [r32 [expr {$GPIOA + 0x00}]]
set sv_aodr   [r32 [expr {$GPIOA + 0x14}]]
set sv_bmoder [r32 [expr {$GPIOB + 0x00}]]
set sv_botype [r32 [expr {$GPIOB + 0x04}]]
set sv_bodr   [r32 [expr {$GPIOB + 0x14}]]

# PB6/PB7 -> open-drain GPIO outputs, released
mww [expr {$GPIOB + 0x14}] [expr {$sv_bodr | 0xC0}]
mww [expr {$GPIOB + 0x04}] [expr {$sv_botype | 0xC0}]
mww [expr {$GPIOB + 0x00}] [expr {($sv_bmoder & ~0xF000) | 0x5000}]

proc probe {label} {
    global GPIOB
    mww [expr {$GPIOB + 0x18}] 0x00C00000   ;# drive PB6/PB7 low
    echo "  $label driven low : [bpins]"
    mww [expr {$GPIOB + 0x18}] 0x000000C0   ;# release
    echo "  $label released   : [bpins]"
    echo "  $label again      : [bpins]"
}

echo "=== mux commanded to MCU side (PA6/PA7 = 1) ==="
mww [expr {$GPIOA + 0x18}] 0x000000C0
probe "MCU-side"

echo "=== mux commanded to FC side (PA6/PA7 = 0) ==="
mww [expr {$GPIOA + 0x18}] 0x00C00000
probe "FC-side"

# restore
mww [expr {$GPIOA + 0x14}] $sv_aodr
mww [expr {$GPIOB + 0x00}] $sv_bmoder
mww [expr {$GPIOB + 0x04}] $sv_botype
mww [expr {$GPIOB + 0x14}] $sv_bodr
echo "restored"
