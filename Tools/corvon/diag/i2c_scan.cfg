# Bit-banged I2C address scan over SWD, with the CPU halted.
# PB6 = I2C1_SCL, PB7 = I2C1_SDA. External 4.7K pull-ups, so open-drain
# outputs plus "release high" is all we need; I2C has no minimum clock rate.
set GPIOB   0x40020400
set O_MODER 0x00
set O_OTYPE 0x04
set O_PUPDR 0x0C
set O_IDR   0x10
set O_ODR   0x14
set O_BSRR  0x18
set O_AFRL  0x20

proc r32 {a} { return [lindex [read_memory $a 32 1] 0] }

proc pin {bit v} {
    global GPIOB O_BSRR
    if {$v} { mww [expr {$GPIOB + $O_BSRR}] [expr {1 << $bit}] } \
        else { mww [expr {$GPIOB + $O_BSRR}] [expr {1 << ($bit + 16)}] }
}
proc scl {v} { pin 6 $v }
proc sda {v} { pin 7 $v }
proc sda_in {} { global GPIOB O_IDR; return [expr {([r32 [expr {$GPIOB + $O_IDR}]] >> 7) & 1}] }

proc i2c_start {} { sda 1; scl 1; sda 0; scl 0 }
proc i2c_stop  {} { sda 0; scl 1; sda 1 }

# returns the ACK bit: 0 = device pulled SDA low = present
proc i2c_byte {b} {
    for {set i 7} {$i >= 0} {incr i -1} {
        sda [expr {($b >> $i) & 1}]
        scl 1
        scl 0
    }
    sda 1
    scl 1
    set ack [sda_in]
    scl 0
    return $ack
}

halt

set sv_moder [r32 [expr {$GPIOB + $O_MODER}]]
set sv_otype [r32 [expr {$GPIOB + $O_OTYPE}]]
set sv_pupdr [r32 [expr {$GPIOB + $O_PUPDR}]]
set sv_afrl  [r32 [expr {$GPIOB + $O_AFRL}]]
set sv_odr   [r32 [expr {$GPIOB + $O_ODR}]]
echo [format "saved MODER=0x%08X OTYPER=0x%08X AFRL=0x%08X ODR=0x%08X" \
      $sv_moder $sv_otype $sv_afrl $sv_odr]

# release both lines, make them open-drain GPIO outputs
mww [expr {$GPIOB + $O_ODR}]   [expr {$sv_odr | 0xC0}]
mww [expr {$GPIOB + $O_OTYPE}] [expr {$sv_otype | 0xC0}]
mww [expr {$GPIOB + $O_MODER}] [expr {($sv_moder & ~0xF000) | 0x5000}]

echo [format "idle SCL=%d SDA=%d" \
      [expr {([r32 [expr {$GPIOB + $O_IDR}]] >> 6) & 1}] [sda_in]]

# 9 clocks first: frees a slave that was left mid-byte by an aborted transfer
sda 1
for {set i 0} {$i < 9} {incr i} { scl 1; scl 0 }
i2c_stop

set found {}
for {set a 0x08} {$a <= 0x77} {incr a} {
    i2c_start
    set ack [i2c_byte [expr {$a << 1}]]
    i2c_stop
    if {$ack == 0} { lappend found $a; echo [format "  ACK at 0x%02X" $a] }
}
if {[llength $found] == 0} { echo "SCAN: no device acked on I2C1 (0x08-0x77)" } \
    else { echo "SCAN: [llength $found] device(s) responded" }

# put the pins back the way ChibiOS had them
mww [expr {$GPIOB + $O_MODER}] $sv_moder
mww [expr {$GPIOB + $O_OTYPE}] $sv_otype
mww [expr {$GPIOB + $O_ODR}]   $sv_odr
echo "pins restored"
